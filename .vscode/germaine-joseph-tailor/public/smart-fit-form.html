<!DOCTYPE html>
<html>
<head>
    <title>Germaine Joseph - Smart Fit Form</title>
    <style>
        body { font-family: 'Garamond', serif; padding: 40px; background: #f4f4f4; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .result-box { margin-top: 20px; padding: 15px; border-left: 5px solid #000; background: #eee; display: none; }
        .alert { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Smart Fit Form</h2>
        <label>Chest Circumference (cm):</label><br>
        <input type="number" id="chest" placeholder="e.g. 100"><br><br>
        
        <label>Waist Circumference (cm):</label><br>
        <input type="number" id="waist" placeholder="e.g. 90"><br><br>

        <label>Fit Preference:</label><br>
        <select id="fit">
            <option value="Slim">Slim Fit (Drop 8)</option>
            <option value="Regular">Contemporary (Drop 7)</option>
            <option value="Classic">Classic Fit (Drop 6)</option>
        </select><br><br>

        <button onclick="runDigitalTailor()">Calculate My Block</button>

        <div id="results" class="result-box">
            <h4>Recommended Starting Blocks:</h4>
            <p id="jacketResult"></p>
            <p id="trouserResult"></p>
            <p id="alertResult" class="alert"></p>
        </div>
    </div>

    <script type="module">
        import { calculateStartingBlock } from '../js/master-tailor.js';
        
        window.runDigitalTailor = async () => {
            const res = await fetch('../data/measurements.json');
            const data = await res.json();
            
            const chest = document.getElementById('chest').value;
            const waist = document.getElementById('waist').value;
            const fit = document.getElementById('fit').value;

            const output = calculateStartingBlock(chest, waist, fit, data);
            
            document.getElementById('results').style.display = 'block';
            document.getElementById('jacketResult').innerText = "Jacket: Size " + output.jacketSize + " (" + output.drop + ")";
            document.getElementById('trouserResult').innerText = "Trouser: Size " + output.trouserSize + " (" + output.drop + ")";
            document.getElementById('alertResult').innerText = output.alertMessage;
        }
    </script>
</body>
</html>
