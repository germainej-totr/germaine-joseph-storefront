<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germaine Joseph | Smart Fit Form</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background: #fafafa; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #results { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .mismatch { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; }
        .standard { background: #f0fff4; border: 1px solid #9ae6b4; color: #276749; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Smart Fit Form</h2>
        <label>Chest Circumference (cm)</label>
        <input type="number" id="chest" placeholder="e.g. 100">

        <label>Waist Circumference (cm)</label>
        <input type="number" id="waist" placeholder="e.g. 90">

        <label>Fit Preference</label>
        <select id="fit">
            <option value="drop_8">Slim Fit (Drop 8)</option>
            <option value="drop_7">Contemporary (Drop 7)</option>
            <option value="drop_6">Classic Fit (Drop 6)</option>
        </select>

        <button onclick="calculateFit()">Determine My Block</button>

        <div id="results"></div>
    </div>

    <script>
        function calculateFit() {
            const chest = document.getElementById('chest').value;
            const waist = document.getElementById('waist').value;
            const fit = document.getElementById('fit').value;

            // The "Secret Sauce" Math
            const jacketSize = Math.round(chest / 2);
            const trouserSize = Math.round((waist / 2) + 5);

            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';

            let message = `<strong>Jacket Block:</strong> Size ${jacketSize}<br>`;
            message += `<strong>Trouser Block:</strong> Size ${trouserSize}<br>`;

            if (jacketSize !== trouserSize) {
                resultsDiv.className = 'mismatch';
                message += `<br>⚠️ <strong>Mismatched Block Detected:</strong> Custom waist adjustment required.`;
            } else {
                resultsDiv.className = 'standard';
                message += `<br>✅ Standard Set confirmed.`;
            }

            resultsDiv.innerHTML = message;
        }
    </script>
</body>
</html>
