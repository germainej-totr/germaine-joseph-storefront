name: predeploy-strict-pr

on:
  pull_request:
    branches:
      - "**"

jobs:
  predeploy-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run strict predeploy gate
        run: npm run qa:predeploy:strict
